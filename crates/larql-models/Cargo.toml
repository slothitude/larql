[package]
name = "larql-models"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Model architecture definitions for LARQL — traits, config parsing, tensor key mappings"
keywords = ["transformer", "model-config", "llm", "architecture"]
categories = ["data-structures"]

[dependencies]
ndarray = "0.16"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Model weight loading
safetensors = "0.5"
memmap2 = "0.9"

[dev-dependencies]
# Tiny Gemma-4-shaped synthetic checkpoint (real safetensors, no downloads) —
# used by tests/test_packedbf16_load.rs. Path lives outside the workspace.
gemma4-fixture = { path = "../../../tests-fixtures/gemma4-fixture" }
